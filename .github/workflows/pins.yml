name: Pins

# The validation gate runs offline, so it can only tell that a pin is well formed. This downloads every file the
# pinned server content names and checks its SHA-256, whenever that content changes.
on:
  pull_request:
    paths:
      - runtime/crafty/server.json
      - scripts/check_pins.py
      - .github/workflows/pins.yml
  push:
    branches: [main]
    paths:
      - runtime/crafty/server.json
      - scripts/check_pins.py
      - .github/workflows/pins.yml
  workflow_dispatch:
    inputs:
      modrinth_version:
        description: Print the pin for this Modrinth version id, instead of checking the pinned content
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    name: Pinned downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every pinned file and check its SHA-256
        if: ${{ inputs.modrinth_version == '' }}
        run: python3 scripts/check_pins.py
      - name: Print the pin for a Modrinth version
        if: ${{ inputs.modrinth_version != '' }}
        env:
          MODRINTH_VERSION: ${{ inputs.modrinth_version }}
        run: python3 scripts/check_pins.py --modrinth-version "$MODRINTH_VERSION"
      # Temporary, for this pull request only: learn the pins of the mods it is about to add.
      - name: Resolve the starter mods
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cat > "$RUNNER_TEMP/starter.json" <<'STARTER'
          {"mods": {
            "fawe": {"url": "https://github.com/IntellectualSites/FastAsyncWorldEdit/releases/download/2.16.2/FastAsyncWorldEdit-Paper-2.16.2.jar", "sha256": "a74219fa660c782c9779e6740867cde395a24d1381dcba6c4f8022e4e9c3f87d"},
            "auraskills": {"url": "https://github.com/Archy-X/AuraSkills/releases/download/2.4.0/AuraSkills-2.4.0.jar", "sha256": "de54cbd2e33d65e8b1704751ae4121ed2f5b466ba89c63a1aadf3a3e629d6a40"},
            "decentholograms": {"url": "https://github.com/DecentSoftware-eu/DecentHolograms/releases/download/2.10.2/DecentHolograms-2.10.2.jar", "sha256": "99bc2b7b0af7846cc45d5800ea0acfae6846d479e048b8e5995c5afa53df27be"},
            "gsit": {"url": "https://github.com/Gecolay/GSit/releases/download/3.8.0/GSit-3.8.0.jar", "sha256": "669820b42047eac476ec754142c682dca4f396e0b84f178e7959cf236e64cc4a"}
          }}
          STARTER
          status=0
          python3 scripts/check_pins.py --manifest "$RUNNER_TEMP/starter.json" || status=1
          python3 scripts/check_pins.py --modrinth-version MtwPHMAS || status=1
          exit "$status"
