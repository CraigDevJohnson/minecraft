name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          cd "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all history and current files
        run: |
          gitleaks git --redact --no-banner --log-opts="--all --full-history" .
          gitleaks dir --redact --no-banner .

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow analyzers
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/workflow-analyzers.XXXXXX")"
          cd "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            actionlint.tar.gz | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          curl --fail --silent --show-error --location --retry 3 \
            --output zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed \
            zizmor.tar.gz | sha256sum --check --strict
          tar -xzf zizmor.tar.gz zizmor
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Validate workflow syntax and shell scripts
        run: |
          command -v shellcheck
          actionlint -color
      - name: Scan workflow and Dependabot security
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --no-progress --format=plain .
