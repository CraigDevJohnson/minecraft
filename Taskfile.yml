version: '3'

tasks:
  check:
    desc: Run the credential-free local and CI validation gate
    cmd: ./scripts/check.sh

  fmt:
    desc: Format shell and OpenTofu source files
    cmds:
      - ./.tools/bin/shfmt -w scripts/*.sh scripts/*.sh.tftpl
      - ./.tools/bin/tofu -chdir=infra fmt -recursive
      - gofmt -w lambda/idlestop lambda/launcher

  infra:validate:
    desc: Validate and test both OpenTofu roots without a backend or AWS credentials
    cmd: ./scripts/check.sh infra:validate

  lambda:package:
    desc: Build the idle-stop function for ARM64 into a reproducible .build/idle-stop.zip
    cmd: python3 scripts/package_idle_stop.py

  lambda:package:launcher:
    desc: Build the launcher function for ARM64 into a reproducible .build/launcher.zip
    cmd: python3 scripts/package_idle_stop.py --function launcher

  server:status:
    desc: Ask the launcher for every world's state, or one world's with WORLD=<id> (LAUNCHER_URL and an AWS profile; see docs/operations/cloud-controls.md)
    cmd: ./scripts/launcher_call.sh status {{if .WORLD}}--world "{{.WORLD}}"{{end}}

  server:start:
    desc: Start a world through the launcher and wait until it is ready; WORLD=<id>, or the first world without it
    cmd: ./scripts/launcher_call.sh start {{if .WORLD}}--world "{{.WORLD}}"{{end}}

  server:stop:
    desc: Stop a world through the launcher and wait until it is off; WORLD=<id>, and FORCE=1 stops over players
    cmd: ./scripts/launcher_call.sh stop {{if .WORLD}}--world "{{.WORLD}}"{{end}} {{if eq .FORCE "1"}}--force{{end}}

  server:restore:
    desc: Restore an archive into a stopped world, then start it; WORLD=<id> ARCHIVE=<name such as 20261016T031500Z.tar.gz>
    cmd: ./scripts/launcher_call.sh restore {{if .WORLD}}--world "{{.WORLD}}"{{end}} --archive "{{.ARCHIVE}}"

  server:mods:
    desc: List each world's mods and whether each is on
    cmd: ./scripts/launcher_call.sh mods

  server:mod-on:
    desc: Switch a mod on for a world from its next start; WORLD=<id> MOD=<id>
    cmd: ./scripts/launcher_call.sh mod-on --world "{{.WORLD}}" --mod "{{.MOD}}"

  server:mod-off:
    desc: Switch a mod off for a world from its next start; WORLD=<id> MOD=<id>
    cmd: ./scripts/launcher_call.sh mod-off --world "{{.WORLD}}" --mod "{{.MOD}}"

  server:allowlist:
    desc: Add or remove one player on every world's allowlist; OP=add|remove EDITION=java|bedrock PLAYER=<name or gamertag>
    cmd: ./scripts/launcher_call.sh allowlist-{{.OP}} --edition "{{.EDITION}}" --player "{{.PLAYER}}"
